name: CG News to Discord

on:
  schedule:
    # 30 分おきに実行（UTC 基準。実行時刻は GitHub の混雑状況で数分〜十数分ずれます）
    - cron: "*/30 * * * *"
  # Actions タブから手動実行するためのボタン
  workflow_dispatch:

# state.json を書き戻すためにリポジトリへの書き込み権限が必要
permissions:
  contents: write

# 前の実行が終わる前に次が始まって二重投稿するのを防ぐ
concurrency:
  group: cg-news
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: 新着をチェックして Discord に投稿
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_ZZZ: ${{ secrets.DISCORD_WEBHOOK_URL_ZZZ }}
          DISCORD_WEBHOOK_URL_FF14: ${{ secrets.DISCORD_WEBHOOK_URL_FF14 }}
        run: python bot.py --once

      - name: 既読状態 (state.json) を保存
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "既読状態に変更はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: 既読状態を更新"
          # 他の実行と競合した場合に備えて取り込んでから push する
          git pull --rebase --autostash
          git push
